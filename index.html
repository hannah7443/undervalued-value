<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make A Wish</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    height: 100%;
  }

  body {
    position: relative;
    isolation: isolate;
    background-image: url("distorted-tile.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -12%;
    background-image: url("assets/images/water-texture.jpeg");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 155%;
    opacity: 0.45;
    pointer-events: none;
    z-index: 1;
  }

  body > * {
    position: relative;
    z-index: 0;
  }
</style>
<body>
  <div class="penny-item">
    <img src="assets/images/penny.png" alt="Penny" class="penny-small">
    <h3 class="penny-header">filler dream</h3>
  </div>
</body>
</html>
